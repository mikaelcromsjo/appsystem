<div x-init="$store.modal_products.title = '{{ "Product Filter" | t }}'"></div>
<div x-init="$store.modal_products.submit = '{{ "Apply Filters" | t }}'"></div>

<form
    hx-post="{{ url_for('set_product_filter') }}"
    hx-swap="none"
    hx-ext="json-enc"
    class="space-y-4"
    x-init="
        $el.addEventListener('htmx:afterRequest', (event) => {
            if (event.detail.elt !== $el) return;
            if (event.detail.xhr.status === 200) {
                $store.modal_products.open = false;
            } else if (event.detail.xhr.status >= 400) {
                showPopup(event);
            }
        })
    "
>

<h2 class="text-xl font-bold mb-4">{{ "Product Filter" | t }}</h2>

    <!-- Product Type -->
    <div>
        <label class="block font-semibold">{{ "Product Type" | t }}</label>
        <select name="type_id" class="border p-1 w-full"
                hx-get="{{ url_for('product_extras_form') }}?filter=1"
                hx-include="[name='type_id']"
                hx-target="#filter-extras-container"
                hx-trigger="change"
                hx-swap="innerHTML">
            <option value="">{{ "Any" | t }}</option>
            {% for pid, ptype in products.items() %}
              <option value="{{ pid }}" {% if filter_dict.get('type_id') == pid %}selected{% endif %}>
                {{ ptype.name }}
              </option>
            {% endfor %}
        </select>
    </div>

    <!-- Name -->
    <div>
        <label class="block font-semibold">{{ "Name" | t }}</label>
        <input type="text" name="name" value="{{ filter_dict.get('name','') }}" class="border p-1 w-full"/>
        <select name="name_type" class="border p-1 mt-1">
            <option value="like">{{ "Contains" | t }}</option>
            <option value="exact">{{ "Exact" | t }}</option>
        </select>
    </div>

    <!-- Visible to All -->
    <div>
        <label class="block font-semibold">{{ "Visible to All" | t }}</label>
        <select name="extra_visilble_all" class="border p-1 mt-1">
            <option value="">{{ "Any" | t }}</option>
            <option value="true" {% if filter_dict.get('extra_visilble_all') == 'true' %}selected{% endif %}>{{ "True" | t }}</option>
            <option value="false" {% if filter_dict.get('extra_visilble_all') == 'false' %}selected{% endif %}>{{ "False" | t }}</option>
        </select>
    </div>

    <!-- Product Category (is_filter_1-7) -->
    <fieldset class="border p-2">
        <legend class="font-bold">{{ "Product Categories" | t }}</legend>
        {% for item in p_filters %}
        <div>
            <label class="block font-semibold text-sm">{{ item.name }}</label>
            <select name="{{ item.id }}" class="border p-1 mt-1">
                <option value="">{{ "Any" | t }}</option>
                <option value="true" {% if filter_dict.get(item.id) == 'true' %}selected{% endif %}>{{ "True" | t }}</option>
                <option value="false" {% if filter_dict.get(item.id) == 'false' %}selected{% endif %}>{{ "False" | t }}</option>
            </select>
        </div>
        {% endfor %}
    </fieldset>

    <!-- Per-type extras (swapped in via HTMX on type change) -->
    <div id="filter-extras-container"></div>

</form>
