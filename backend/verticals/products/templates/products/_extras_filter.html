{% if product_extras %}
<fieldset class="border p-2" id="product-extras-filter-fieldset">
  <legend class="font-bold">{{ "Extras" | t }}</legend>

  {% for key, meta in product_extras.items() if meta.get('filter') %}
    {% if meta.type == "bool" %}
    <div class="mb-2">
      <label class="block text-sm font-semibold">{{ meta.label }}</label>
      <select name="extra.{{ key }}" class="border p-1 mt-1">
          <option value="">{{ "Any" | t }}</option>
          <option value="true" {% if filter_dict and filter_dict.get('extra.' ~ key) == 'true' %}selected{% endif %}>{{ "True" | t }}</option>
          <option value="false" {% if filter_dict and filter_dict.get('extra.' ~ key) == 'false' %}selected{% endif %}>{{ "False" | t }}</option>
      </select>
    </div>
    {% elif meta.type == "select" %}
    <div class="mb-2">
      <label class="block text-sm font-semibold">{{ meta.label }}</label>
      <select name="extra.{{ key }}" multiple class="border p-1 w-full">
        {% for opt_key, opt_label in meta.options.items() %}
          <option value="{{ opt_key }}" {% if filter_dict and opt_key in filter_dict.get('extra.' ~ key, []) %}selected{% endif %}>{{ opt_label }}</option>
        {% endfor %}
      </select>
    </div>
    {% else %}
    <div class="mb-2">
      <label class="block text-sm font-semibold">{{ meta.label }}</label>
      <input type="text" name="extra.{{ key }}"
             value="{{ filter_dict.get('extra.' ~ key, '') if filter_dict else '' }}"
             class="border p-1 w-full"/>
      <select name="extra.{{ key }}_type" class="border p-1 mt-1">
          <option value="like">{{ "Contains" | t }}</option>
          <option value="exact">{{ "Exact" | t }}</option>
      </select>
    </div>
    {% endif %}
  {% endfor %}

</fieldset>
{% endif %}
