<div x-data="{ search: '', _prevCustomer: null }" x-init="
    $watch(() => Alpine.store('customer').id, (newId, oldId) => {
        console.log('Customer Has updated!')
        if (newId && newId !== oldId) {
            console.log('Its NEW!')
            // customer changed → trigger reload

            const activeRow = $root.querySelector('.bg-blue-100.font-bold.text-blue-600');
            if (activeRow) { 
                $nextTick(() => activeRow.click()); 
            }
        }
    });
">
    <!-- Search Box -->
    <input 
        type="text" 
        placeholder="{{ "Search product..." | t }}" 
        x-model="search"
        class="border p-2 mb-2 w-full"
    />

    <!-- Product List -->
    <div id="product-list" 
         _x-effect="
            const currentCustomer = Alpine.store('customer').id;
            if (currentCustomer && currentCustomer !== prevCustomer) {
                prevCustomer = currentCustomer;
                const activeRow = $el.querySelector('.bg-blue-100.font-bold.text-blue-600');
                if (activeRow) $nextTick(() => { activeRow.click(); });
            }
         "
    >
        {% for product in products %}
        <div tabindex="0"
             x-show="(
                {{ 'true' if product.extra_visilble_all else 'false' }} ||
                ( (Alpine.store('productFilters').is_filter_1 && {{ 'true' if product.is_filter_1 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_2 && {{ 'true' if product.is_filter_2 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_3 && {{ 'true' if product.is_filter_3 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_4 && {{ 'true' if product.is_filter_4 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_5 && {{ 'true' if product.is_filter_5 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_6 && {{ 'true' if product.is_filter_6 else 'false' }}) ||
                  (Alpine.store('productFilters').is_filter_7 && {{ 'true' if product.is_filter_7 else 'false' }})
                )
             ) && ('{{ product.name.lower() }}'.includes(search.toLowerCase()))"
             class="p-2 cursor-pointer border-b"
             :class="{
                'bg-blue-100 font-bold text-blue-600': Alpine.store('product').id === {{ product.id }},
                'bg-white font-normal text-gray-900': Alpine.store('product').id !== {{ product.id }}
             }"
             @click="
                Alpine.store('productCustomer').status = '-';
                Alpine.store('productCustomer').type_status = '-';
                Alpine.store('product').id = {{ product.id }};
                Alpine.store('product').type_id = '{{ product.type_id }}';
                if (Alpine.store('customer').id) enableProduct();
             "
             hx-get="{{ url_for('calls_product_detail', product_id=product.id) }}?list=short"
             hx-target="#product-details"
             hx-swap="innerHTML"
             :hx-vals="JSON.stringify(Alpine.store('customer')?.id ? { customer_id: Alpine.store('customer').id } : {})"
        >
            {{ product.name }}
        </div>
        {% endfor %}
    </div>
</div>
