<div id="accounts-container">
    <div id="accounts-list">

        <div class="full-table">
            <table class="table-auto w-full border overflow-x-auto">
                {% from "components/table.html" import table_head_row %}
<thead>
                    <tr>{{ table_head_row(columns) }}</tr>
                </thead>
                <tbody>
                    {% for account in accounts %}
                    <tr hx-get="{{ url_for('account_detail', account_id=account.id) }}"
                        hx-target="#modal-container-accounts"
                        hx-trigger="click"
                        class="cursor-pointer hover:bg-gray-100"
                        @click="$store.modal_accounts.open = true">

                        <td class="px-2 py-1 border">{{ account.name }}</td>
                        <td class="px-2 py-1 border">{{ account.extra.bank_name or '' }}</td>
                        <td class="px-2 py-1 border">{{ account.extra.iban or '' }}</td>
                        <td x-show="is_admin" class="px-2 py-1 border">{{ account.extra.comment or '' }}</td>

                        <td class="px-2 py-1 border text-center" 
                            @click.stop
                            >

                            <button 
                                hx-get="{{ url_for('account_detail', account_id=account.id) }}"
                                hx-target="#modal-container-accounts"
                                hx-swap="innerHTML"
                                @click="$store.modal_accounts.open = true"
                            >
                                {{ "Edit" | t }}
                            </button>                
                            <button 
                                hx-post="{{ url_for('delete_account', account_id=account.id) }}"
                                hx-on="htmx:afterRequest: 
                                    showPopup(event);
                                    htmx.ajax('GET', '{{ url_for('accounts_list') }}', {target:'#accounts-container'}); "
                                hx-trigger="confirmed"
                                x-confirm="{{'Are you sure you want to delete this record?' | t }}"
                            >
                                {{ "Delete" | t }}
                            </button>    
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="mt-2 flex gap-2">
            <button hx-get="{{ url_for('account_detail', account_id=0) }}"
                    hx-target="#modal-container-accounts"
                    @click="$store.modal_accounts.open = true"
                    class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
                {{ "New Account" | t }}
            </button>
        </div>
        
    </div>
</div>
