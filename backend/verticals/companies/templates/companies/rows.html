{% for company in companies %}
<tr hx-get="{{ url_for('company_detail', company_id=company.id) }}"
    hx-target="#modal-container-companies"
    hx-trigger="click"
    class="cursor-pointer hover:bg-gray-100"
    @click="$store.modal_companies.open = true">
    <td class="px-2 py-1 border">{{ company.extra.company_name }}</td>
    <td class="px-2 py-1 border">{{ company.first_name }} {{ company.last_name }}</td>
    <td class="px-2 py-1 border">{{ company.email }}</td>
    <td x-show="is_admin" class="px-2 py-1 border">{{ company.team.name }}</td>
    <td class="px-2 py-1 border text-center" @click.stop>
        <button
            hx-get="{{ url_for('company_detail', company_id=company.id) }}"
            hx-target="#modal-container-companies"
            hx-swap="innerHTML"
            @click="$store.modal_companies.open = true">
            {{ "Edit" | t }}
        </button>
        <button
            hx-post="{{ url_for('delete_company', company_id=company.id) }}"
            hx-on="htmx:afterRequest: showPopup(event); htmx.ajax('GET', '{{ url_for('companies_rows') }}', {target:'#companies-tbody', swap:'innerHTML'});"
            hx-trigger="confirmed"
            x-confirm="{{'Are you sure you want to delete this record?' | t }}">
            {{ "Delete" | t }}
        </button>
    </td>
</tr>
{% endfor %}
