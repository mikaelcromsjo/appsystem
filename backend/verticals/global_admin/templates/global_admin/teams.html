<div x-data="{ showCreate: false }">

  <div class="flex items-center gap-3 mb-4">
    <button
      hx-get="{{ url_for('global_admin_tenants') }}"
      hx-target="#global_admin_content"
      class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200 text-sm">
      ← Back
    </button>
    <h2 class="text-lg font-bold">Teams — {{ tenant.name }}</h2>
    <button @click="showCreate = !showCreate"
      class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200 text-sm ml-auto">
      + New Team
    </button>
  </div>

  {% if error %}
  <div class="mb-3 px-3 py-2 bg-red-50 border border-red-200 rounded text-red-700 text-sm">{{ error }}</div>
  {% endif %}

  {% if saved %}
  <div class="mb-3 px-3 py-2 bg-green-50 border border-green-200 rounded text-green-700 text-sm">Team created.</div>
  {% endif %}

  <!-- Create form -->
  <div x-show="showCreate" x-transition class="mb-4 p-4 border rounded bg-gray-50">
    <form
      hx-post="{{ url_for('global_admin_team_create', tenant_id=tenant.id) }}"
      hx-target="#global_admin_content"
      hx-swap="innerHTML"
      class="flex gap-3 items-end">
      <div>
        <label class="block text-xs font-medium mb-1">Team name</label>
        <input type="text" name="name" required placeholder="e.g. Sales"
          class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button type="submit"
        class="px-4 py-1.5 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
        Create
      </button>
    </form>
  </div>

  <!-- Teams table -->
  <div class="full-table">
    <table class="table-fixed w-full border overflow-x-auto">
      <thead>
        <tr>
          <th class="w-[10%] px-2 py-1 border">ID</th>
          <th class="w-[90%] px-2 py-1 border">Name</th>
        </tr>
      </thead>
      <tbody>
        {% for team in teams %}
        <tr class="hover:bg-gray-50">
          <td class="px-2 py-1 border text-sm">{{ team.id }}</td>
          <td class="px-2 py-1 border text-sm">{{ team.name }}</td>
        </tr>
        {% endfor %}
        {% if not teams %}
        <tr>
          <td colspan="2" class="px-2 py-3 border text-sm text-gray-400 text-center">No teams yet.</td>
        </tr>
        {% endif %}
      </tbody>
    </table>
  </div>

</div>
