
<div id="invoice-container">
    <div id="invoice-list">
            <div class="full-table">

        <table class="table-auto w-full border overflow-x-auto" x-data="{ selectedRow: 0 }">
            {% from "components/table.html" import table_head_row %}
<thead>
                <tr>{{ table_head_row(columns) }}</tr>
            </thead>
            <tbody id="invoices-tbody"
                hx-get="{{ url_for('invoices_rows') }}"
                hx-trigger="invoicesRowsReload from:body"
                hx-swap="innerHTML">
                {% include "invoices/rows.html" %}
            </tbody>
        </table>
            </div>
        <div class="mt-2 flex gap-2">

            <button hx-get="/invoices/new" 
                    hx-target="#modal-container-invoices"
                    @click="$store.modal_invoices.open = true"

                class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
                {{ "New invoice" | t }}
            </button>
        </div>
    </div>
</div>
