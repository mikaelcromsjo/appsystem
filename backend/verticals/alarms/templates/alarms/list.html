<div id="alarm-container">
    <div id="alarm-list">
            <div class="full-table">
            <table class="table-auto w-full border overflow-x-auto">
                {% from "components/table.html" import table_head_row %}
<thead>
                    <tr>{{ table_head_row(columns) }}</tr>
                </thead>
                <tbody id="alarms-tbody"
                    hx-get="{{ url_for('alarms_rows') }}"
                    hx-trigger="alarmsRowsReload from:body"
                    hx-swap="innerHTML">
                    {% include "alarms/rows.html" %}
                </tbody>
            </table>

                    <div class="mt-2 flex gap-2">
<!--
            <button hx-get="/alarms/alarm/0" hx-target="#modal-container-alarms" @click="$store.modal_alarms.open = true"
                class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
                {{ "New Alarm" | t }}
            </button>
            </div>
-->
        </div>
    </div>

        <div class="mt-2 flex gap-2">

            <form hx-post="/alarms/set_filter" hx-swap="none" hx-ext="json-enc"
                class="space-y-4">

                <!-- Alarm date range -->
                <div class="mb-2">
                    <div class="flex gap-2 items-center">
                        <input type="date" lang="sv"  name="alarm_date_filter-start" value="" class="border p-1">
                        <span>{{ "to" | t }}</span>
                        <input type="date" name="alarm_date_filter-end" value="" class="border p-1">
                        <button type="submit" lang="sv"  class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
                            {{ "Apply filters" | t }}
                        </button>
                    </div>
                </div>
            </form>

        </div>

    <div class="mt-4" id="alarm-info">
    </div>
</div>
