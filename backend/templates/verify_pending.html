{% extends "open_base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="flex items-center justify-center">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg text-center">
    <div class="mb-4 text-4xl">✉️</div>
    <h3 class="mb-2 text-2xl font-semibold text-gray-800">Check your email</h3>
    <p class="mb-6 text-gray-500">
      We sent a login link to <strong>{{ email }}</strong>.<br>
      Click the link in the email to complete your login.<br>
      It expires in 15 minutes.
    </p>
    <p class="text-sm text-gray-400">
      Wrong account? <a href="/logout" class="text-indigo-600 hover:underline">Start over</a>
    </p>
  </div>
</div>
{% endblock %}
