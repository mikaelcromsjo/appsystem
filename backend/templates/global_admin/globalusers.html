<div x-data="{ selectedRow: 0, showCreate: false }">

  <div class="flex items-center gap-3 mb-4">
    <h2 class="text-lg font-bold">Global Users</h2>
    <button
      hx-get="{{ url_for('global_admin_dashboard') }}"
      hx-target="#global_admin_content"
      class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200 text-sm">
      ← Back
    </button>
    <button @click="showCreate = !showCreate"
      class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200 text-sm ml-auto">
      + New User
    </button>
  </div>

  {% if error %}
  <div class="mb-3 px-3 py-2 bg-red-50 border border-red-200 rounded text-red-700 text-sm">{{ error }}</div>
  {% endif %}

  <!-- Create form (toggle) -->
  <div x-show="showCreate" x-transition class="mb-4 p-4 border rounded bg-gray-50">
    <form
      hx-post="{{ url_for('globaluser_create') }}"
      hx-target="#global_admin_content"
      hx-swap="innerHTML"
      class="flex gap-3 items-end flex-wrap">
      <div>
        <label class="block text-xs font-medium mb-1">Email</label>
        <input type="email" name="email" required
          class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">Password</label>
        <input type="password" name="password" required
          class="border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button type="submit"
        class="px-4 py-1.5 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
        Create
      </button>
    </form>
  </div>

  <div class="full-table">
    <table class="table-fixed w-full border overflow-x-auto">
      <thead>
        <tr>
          <th class="w-[5%] px-2 py-1 border">ID</th>
          <th class="w-[30%] px-2 py-1 border">Email</th>
          <th class="w-[10%] px-2 py-1 border text-center">Superadmin</th>
          <th class="w-[30%] px-2 py-1 border">Tenants</th>
          <th class="w-[25%] px-2 py-1 border">Assign Tenant</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr
          :class="{ 'bg-blue-50': selectedRow === {{ loop.index }}, 'hover:bg-gray-50': selectedRow !== {{ loop.index }} }"
          @click="selectedRow = {{ loop.index }}"
          class="cursor-pointer align-top">

          <td class="px-2 py-2 border text-sm">{{ user.id }}</td>
          <td class="px-2 py-2 border text-sm">{{ user.email }}</td>

          <!-- Superadmin toggle -->
          <td class="px-2 py-2 border text-center" @click.stop>
            <form
              hx-post="/global-admin/globalusers/{{ user.id }}/set-superadmin"
              hx-target="#global_admin_content"
              hx-swap="innerHTML">
              <input type="hidden" name="is_superadmin" value="">
              <input type="checkbox" name="is_superadmin" value="on"
                {% if user.is_superadmin %}checked{% endif %}
                class="w-4 h-4"
                @change="$el.closest('form').requestSubmit()">
            </form>
          </td>

          <!-- Tenant memberships -->
          <td class="px-2 py-2 border" @click.stop>
            <div class="flex flex-wrap gap-1">
              {% for tenant in tenants %}
              {% if tenant.id in memberships[user.id] %}
              <form
                hx-post="/global-admin/globalusers/{{ user.id }}/remove-tenant"
                hx-target="#global_admin_content"
                hx-swap="innerHTML"
                class="inline">
                <input type="hidden" name="tenant_id" value="{{ tenant.id }}">
                <button type="submit"
                  class="px-2 py-0.5 bg-blue-100 border border-blue-300 rounded text-xs hover:bg-red-100 hover:border-red-300"
                  title="Click to remove">
                  {{ tenant.slug }} ✕
                </button>
              </form>
              {% endif %}
              {% endfor %}
            </div>
          </td>

          <!-- Assign tenant -->
          <td class="px-2 py-2 border" @click.stop>
            <form
              hx-post="/global-admin/globalusers/{{ user.id }}/assign-tenant"
              hx-target="#global_admin_content"
              hx-swap="innerHTML"
              class="flex gap-1">
              <select name="tenant_id" class="border rounded px-1 py-0.5 text-xs">
                {% for tenant in tenants %}
                {% if tenant.id not in memberships[user.id] %}
                <option value="{{ tenant.id }}">{{ tenant.slug }}</option>
                {% endif %}
                {% endfor %}
              </select>
              <button type="submit"
                class="px-2 py-0.5 border rounded bg-gray-100 hover:bg-gray-200 text-xs">
                Add
              </button>
            </form>
          </td>

        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
