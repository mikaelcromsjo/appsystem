<h1 class="text-xl font-bold mb-4">Global Admin</h1>

<div class="flex gap-4 mb-6">
  <div class="bg-gray-50 border rounded px-6 py-4 text-center">
    <div class="text-3xl font-bold">{{ tenant_count }}</div>
    <div class="text-sm text-gray-500">Tenants</div>
  </div>
  <div class="bg-gray-50 border rounded px-6 py-4 text-center">
    <div class="text-3xl font-bold">{{ user_count }}</div>
    <div class="text-sm text-gray-500">Global Users</div>
  </div>
</div>

<div class="flex gap-2">
  <button
    hx-get="{{ url_for('global_admin_tenants') }}"
    hx-target="#global_admin_content"
    class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
    Tenants
  </button>
  <button
    hx-get="{{ url_for('global_admin_globalusers') }}"
    hx-target="#global_admin_content"
    class="px-3 py-1 border rounded bg-gray-100 hover:bg-gray-200">
    Global Users
  </button>
</div>
