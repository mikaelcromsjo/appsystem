services:
  app:
    build: .
    container_name: fastapi_htmx_dev
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - demo_app_db:/dbdata
    environment:
      - MASTER_DATABASE_URL=sqlite:////dbdata/master.db
      - DATABASE_URL=sqlite:////dbdata/app.db
      - DEBUG=true
      # Set in production:
      # - JWT_SECRET_KEY=<strong-random-key>
      # - SESSION_SECRET=<strong-random-key>
      # - ACCESS_TOKEN_EXPIRE_MINUTES=60

    command: uvicorn main:app --host 0.0.0.0 --port 8010 --proxy-headers --forwarded-allow-ips='*'      

volumes:
  demo_app_db:
    external: true
